<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landscape Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020202;
      --panel: #131416;
      --panel-2: #2d2f34;
      --line: #ededed;
      --muted: #c8c8c8;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: #fff;
      overflow-x: auto;
    }

    .layout {
      min-width: 1400px;
      display: grid;
      grid-template-columns: 190px minmax(320px, 1fr) 2fr;
      gap: 26px;
      padding: 32px;
    }

    .rail, .about, .profile { border: 3px solid var(--line); border-radius: 90px; }
    .rail {
      height: 720px;
      background: linear-gradient(180deg, #16181b, #0e0f12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 32px;
      padding: 44px 20px;
    }
    .icon {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: #2f3338;
      border: 2px solid #575b62;
      font-size: 34px;
    }
    .plus { font-size: 64px; line-height: 1; margin-top: 6px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(300px, 1fr);
      grid-column: span 2;
      gap: 0;
      min-height: 300px;
      margin-bottom: 14px;
    }
    .about {
      background: linear-gradient(90deg, #17191d 0%, #111215 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 1px;
      font-size: 42px;
      position: relative;
      padding: 32px;
    }
    .about small {
      position: absolute;
      right: 40px;
      font-size: 38px;
      color: #fff;
      font-weight: 500;
    }
    .profile {
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      writing-mode: vertical-rl;
      font-size: 58px;
      padding: 20px;
    }
    .profile img {
      width: 190px;
      height: 190px;
      border-radius: 36px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,.7);
    }

    .hint {
      grid-column: 1;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "Caveat", cursive;
      font-size: 68px;
      color: #efefef;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .95;
    }

    .gallery-wrap {
      grid-column: 2 / 4;
      column-count: 2;
      column-gap: 24px;
    }

    .card {
      border: 2px solid rgba(255,255,255,.45);
      border-radius: 42px;
      overflow: hidden;
      background: #080808;
      position: relative;
      cursor: pointer;
      margin-bottom: 24px;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      padding: 10px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      background: #0e0e0e;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform: rotate(90deg);
      transform-origin: center center;
      transition: opacity .25s ease;
      background: #0a0a0a;
    }

    .viewer-note {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 14px;
      z-index: 20;
      background: rgba(0,0,0,.75);
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
    }

    @media (max-width: 1100px) {
      .layout { min-width: 1100px; }
      .about { font-size: 34px; }
      .profile { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="viewer-note" id="viewerNote">Tap image to see before</div>
  <main class="layout">
    <aside class="rail">
      <a class="icon" href="#" aria-label="Instagram">📷</a>
      <a class="icon" href="#" aria-label="Mail">✉️</a>
      <div class="plus">+</div>
    </aside>

    <section class="hero">
      <div class="about">Name <small>About Me</small></div>
      <div class="profile">Profile Picture
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&q=80" alt="Profile Picture" />

    </section>

    <aside class="hint">Tap images to see before</aside>

    <section class="gallery-wrap" id="gallery"></section>
  </main>

      { before: "https://sahil-aditya.github.io/Creative_Gallery/images/before271.jpg", after: "https://sahil-aditya.github.io/Creative_Gallery/images/after271.jpg" },
      { before: "https://sahil-aditya.github.io/Creative_Gallery/images/before291.jpg", after: "https://sahil-aditya.github.io/Creative_Gallery/images/after291.jpg" }
    ];

    const FALLBACK_RATIO = 0.72;

    const gallery = document.getElementById('gallery');
    const viewerNote = document.getElementById('viewerNote');

    galleryData.forEach((item, index) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.aspectRatio = `${FALLBACK_RATIO}`;

      const frame = document.createElement('div');
      frame.className = 'card-inner';

      const img = document.createElement('img');
      img.src = item.after;
      img.alt = `Gallery image ${index + 1}`;
      img.dataset.before = item.before;
      img.dataset.after = item.after;
      img.dataset.show = 'after';

      img.addEventListener('load', () => {
        if (img.naturalWidth && img.naturalHeight) {
          const rotatedRatio = img.naturalHeight / img.naturalWidth;
          card.style.aspectRatio = `${rotatedRatio}`;
        }
      });

      card.addEventListener('click', () => {
        const showingAfter = img.dataset.show === 'after';
        img.src = showingAfter ? img.dataset.before : img.dataset.after;
        img.dataset.show = showingAfter ? 'before' : 'after';
      });

      card.addEventListener('mouseenter', () => { viewerNote.style.display = 'block'; });
      card.addEventListener('mouseleave', () => { viewerNote.style.display = 'none'; });

      frame.appendChild(img);
      card.appendChild(frame);
      gallery.appendChild(card);
    });
  </script>
</body>
</html>
